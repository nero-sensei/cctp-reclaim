services:
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    restart: unless-stopped

  updater:
    build:
      context: .
      dockerfile: updater/Dockerfile
    environment:
      RPC_URL: ${RPC_URL:-https://api.mainnet-beta.solana.com}
      STATS_URL: ${STATS_URL}
      STATS_TOKEN: ${STATS_TOKEN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      INTERVAL_HOURS: ${INTERVAL_HOURS:-24}
      STATS_PAUSE_MS: ${STATS_PAUSE_MS:-250}
      REPO_DIR: ${REPO_DIR:-}
      GIT_SSH_COMMAND: ssh -i /keys/deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      GIT_AUTHOR_NAME: nero
      GIT_AUTHOR_EMAIL: nero-sensei@users.noreply.github.com
      GIT_COMMITTER_NAME: nero
      GIT_COMMITTER_EMAIL: nero-sensei@users.noreply.github.com
    volumes:
      - ${REPO_MOUNT:-./.norepo}:/repo
      - ${KEYS_MOUNT:-./.nokeys}:/keys:ro
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis:
